<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CareerConnect</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <a href="index.html" class="logo">Career<span>Connect</span></a>
        <h2>Welcome Back!</h2>
        <p>Login to continue your career journey.</p>

        <form id="loginForm">
            <label>Email Address</label>
            <input type="email" id="loginEmail" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" required>

            <button type="submit" class="btn-primary full-btn">Login</button>
        </form>

        <p id="authMessage"></p>
        <p class="auth-bottom">Don't have an account?
            <a href="signup.html">Create Account</a>
        </p>
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
